<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Sign in · Patchriot</title><link rel="stylesheet" href="/login.css"></head>
<body><main>
<a class="brand" href="/">patchriot<span>_</span></a>
<section aria-labelledby="title"><p class="eyebrow">YOUR ACCOUNT</p><h1 id="title">Welcome back.</h1><p>Sign in with your Patchriot username and password.</p>
<form method="post" action="/login">
<label for="username">Username</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="40">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256">
<button type="submit">Open my account <span aria-hidden="true">↗</span></button>
</form>
<p class="alternate">Use Google, GitHub or a wallet? <a href="/#/account">See all sign-in options</a></p>
</section><footer>Shared intelligence. Practical defence.</footer>
</main></body></html>
