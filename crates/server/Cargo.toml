[package]
name = "patchriot-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# Transaction encoding only; signing and recovery use libsecp256k1 below.
alloy-consensus = { version = "=1.8.3", default-features = false }
alloy-eips = { version = "=1.8.3", default-features = false }
alloy-primitives = { version = "1.7.3", default-features = false, features = ["secp256k1"] }
secp256k1 = { version = "0.31.1", features = ["recovery"] }
argon2 = { version = "0.6", features = ["getrandom"] }
axum = "0.8.9"
bs58 = "0.5.1"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hex = "0.4.3"
patchriot-protocol = { path = "../protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["set-header", "fs"] }
url = "2.5"
uuid = { version = "1.22", features = ["v4", "serde"] }
zeroize = "1"
openidconnect = { version = "4.1.0", default-features = false }

[dev-dependencies]
rsa = "0.9"
rand = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
