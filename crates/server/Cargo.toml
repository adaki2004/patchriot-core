[package]
name = "patchriot-core"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hex = "0.4.3"
patchriot-protocol = { path = "../protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["set-header", "fs"] }
url = "2.5"
uuid = { version = "1.22", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
