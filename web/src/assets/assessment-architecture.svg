<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">Patchriot network architecture</title><desc id="architecture-description">An authorized website connects to Patchriot Core, which contains account, checkout and evidence services and a plugged-in dispatcher. The dispatcher connects to approved agent instances numbered 1, 2 through N, stacked vertically. A dotted rectangle groups these inference contributors within an optional mesh network for businesses and enterprise solutions. Each agent uses Kali Linux, Hermes and a scoped relay with approved NEAR AI or Venice inference. Evidence returns through the dispatcher to a private report. Patchriot operates the agents today; public contributors and business-managed fleets are planned.</desc>
